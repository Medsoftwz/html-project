<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medical Intake Engine</title>

<style>
body{
  font-family:Arial,sans-serif;
  margin:0;
  background:#f4f6f8;
  color:#222;
  padding-bottom:80px;
}

.header{
  position:sticky;
  top:0;
  background:white;
  z-index:999;
  box-shadow:0 2px 6px rgba(0,0,0,0.12);
  padding:10px;
}

h1{ margin:0; text-align:center; color:#1f4d7a; font-size:16px; }
h2{ color:#004080; font-size:18px; border-bottom:2px solid #d9e2ec; padding-bottom:6px; }

.disclaimer{ margin-top:6px; text-align:center; font-size:11px; color:#666; line-height:1.4; }

.tabs{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:6px;
  margin-top:10px;
}

.tab-btn{
  border:none;
  background:#468CD2;
  color:white;
  padding:10px 14px;
  border-radius:7px;
  cursor:pointer;
  font-size:14px;
}

.tab-btn.active{ background:#00C000; }
.tab-btn.completed{ background:#1f5a22; }

.info-btn{
  color:#1565c0;
  cursor:pointer;
  font-weight:bold;
  margin-left:6px;
  font-size:14px;
}

.info-btn:hover{
  color:#0d47a1;
}

.info-modal{
  display:none;
  position:fixed;
  z-index:99999;
  left:0;
  top:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.35);
}

.info-modal-content{
  background:#fffde7;
  width:min(92%, 420px);
  margin:18vh auto;
  padding:5px 18px 16px 18px;
  border-radius:10px;
  box-shadow:0 4px 18px rgba(0,0,0,0.25);
  position:relative;
}

.info-close{
  position:absolute;
  right:10px;
  top:6px;
  font-size:20px;
  cursor:pointer;
  color:#666;
}

.info-text{
  color:#003c7a;
  line-height:1.5;
  white-space:pre-line;
  font-size:14px;
}

.container{ max-width:1100px; margin:auto; padding:12px; }

.section{ display:none; }
.section.active{ display:block; }

.card{
  background:white;
  border-radius:10px;
  padding:14px;
  margin-bottom:12px;
  box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

.question{ margin-bottom:20px; }
.question-title{ font-weight:500; color:#003c7a; margin-bottom:10px; font-size:17px; }
.question-subtitle{ font-size:12px; color:#666; margin-top:4px; }

label{ display:block; margin:8px 0; font-size:15px; color:#222; }

.option-label{
  display:block;
  margin:8px 0;
  font-size:16px;
  color:#800040;
  line-height:1.5;
}

input[type="text"],
input[type="number"],
input[type="date"]{
  width:50%;
  box-sizing:border-box;
  padding:10px;
  border:1px solid #ccc;
  border-radius:6px;
  font-size:14px;
}

textarea{
  width:100%;
  min-height:140px;
  box-sizing:border-box;
  padding:10px;
  border:1px solid #ccc;
  border-radius:6px;
  font-size:15px;
  line-height:1.5;
  resize:vertical;
}

select{
  width:220px;
  padding:8px;
  border:1px solid #ccc;
  border-radius:6px;
  font-size:14px;
}

textarea{ min-height:100px; resize:vertical; }

.section-notes{ margin-top:18px; }
.section-notes textarea{ background:#fffef6; }

.button-row{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  justify-content:center;
  margin-top:20px;
}

button.action{
  border:none;
  background:#1f4d7a;
  color:white;
  padding:12px 18px;
  border-radius:8px;
  cursor:pointer;
}

button.action:hover{ background:#295f95; }

.progress-wrap{
  position:fixed;
  left:0;
  bottom:0;
  width:100%;
  height:24px;
  background:#ddd;
}

.progress-bar{
  height:100%;
  width:0%;
  background:#2e7d32;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:0.3s;
  font-size:12px;
  font-weight:bold;
}

.code-badge{
  display:inline-block;
  background:#eef4ff;
  color:#1d4f91;
  border-radius:4px;
  padding:2px 6px;
  font-size:11px;
  margin-left:6px;
}

@media print{
  .no-print{
    display:none;
  }
}
</style>
</head>
<body>

<div class="header no-print">
  <h1 id="mainTitle"></h1>

  <div class="disclaimer">
    Experimentele medische intake software — geen medisch hulpmiddel.<br>
    Geen gegevens worden centraal opgeslagen of verzonden.
  </div>

  <div class="tabs" id="tabs"></div>
</div>

<div class="container" id="container"></div>

<div class="progress-wrap no-print">
  <div class="progress-bar" id="progressBar">0%</div>
</div>

<script>

/* =====================================================
   CONFIGURATIE
===================================================== */

const FORM_CONFIG = {

  title: "Vertigo Intake",

  pdfPrefix: "Vertigo",

  sections: [

    {
      id: "algemeen",
      title: "Algemeen",
      freeText: true,

      questions: [

        {
          id: "naam",
          type: "text",
          text: "Naam"
        },

        {
          id: "geboortedatum",
          type: "date",
          text: "Geboortedatum"
        },

        {
          id: "geslacht",
          type: "radio",
          text: "Geslacht",
          options: [
            "Man",
            "Vrouw",
            "Anders"
          ]
        }
      ]
    },

    {
      id: "klachten",
      title: "Anamnese",
      freeText: true,

      questions: [

        {
          id: "type_duizeligheid",
          type: "radio",
          text: "Type duizeligheid",
          icd11: "MG22",
          options: [
            "Draaiend",
            "Licht gevoel in hoofd",
            "Onevenwicht",
            "Presyncope"
          ]
        },

        {
          id: "duur_episode",
          type: "select",
          text: "Duur van episode",
          options: [
            "Seconden",
            "Minuten",
            "Uren",
            "Continu"
          ]
        },

        {
          id: "positie",
          type: "presence",
          text: "Uitgelokt door positieverandering",
          icd11: "AB31"
        },

        {
          id: "misselijkheid",
          type: "presence",
          text: "Misselijkheid",
          icd11: "NF08.3"
        },

        {
          id: "tinnitus",
          type: "presence",
          text: "Tinnitus",
          icd11: "MC41",
		    info: `
Subjectief oorsuizen.

Kan voorkomen bij:
- Ménière
- lawaaischade
- vestibulaire aandoeningen
	`
		  
        },

        {
          id: "gehoorverlies",
          type: "presence",
          text: "Gehoorverlies",
          icd11: "AB55"
        }
      ]
    },

    {
      id: "klinisch",
      title: "Onderzoek",
      freeText: true,

      questions: [

        {
          id: "nystagmus",
          type: "presence",
          text: "Nystagmus",
		  		    info: `
Nystagmus

* horizontale nystagmus: snelle fase naar rechts of links
* verticale nystagmus: snelle fase naar boven of onder
* rotatoire nystagmus: horaire (clockwise - CW) of antihoraire (counterclockwise - CCW) nystagmus. 
	`
		 },

        {
          id: "neurologische_uitval",
          type: "presence",
          text: "Neurologische uitvalsverschijnselen",
          icd11: "QF10"
        },

        {
          id: "dixhallpike",
          type: "radio",
          text: "Dix-Hallpike test",
		    info: `
Positieve test:
- torsionele nystagmus
- latentietijd
- fatigabiliteit

Suggestief voor BPPV.
`,		  
          options: [
            "Positief",
            "Negatief",
            "Niet uitgevoerd"
          ]
        },

        {
          id: "dixhallpike",
          type: "radio",
          text: "Evenwichsproeven zoals Romberg, Unterberger, Babinski-Weill, Barany",
          options: [
            "Niet gestoord - Normaal",
            "Gestoord - Afwijkend",
            "Niet uitgevoerd"
          ]
        }		
				
      ]
    },

    {
      id: "beeldvorming",
      title: "Labo / Beeld",
      freeText: true,

      questions: [

        {
          id: "mri",
          type: "radio",
          text: "MRI cerebrum",
          options: [
            "Normaal",
            "Afwijkend",
            "Niet uitgevoerd"
		          ]
        }
      ]
    },	
			
{
  id: "therapie",
  title: "Therapie",
  freeText: true,

  questions: [

    {
      id: "epley",
      type: "radio",
      text: "Epley en/of Semont maneuver uitgevoerd",
	  options: [
            "Uitgevoerd",
            "Niet uitgevoerd"
		          ]
	     },

    {
      id: "medicatie",
      type: "textarea",
      text: "Medicatie"
    }
]
}			
]
};

/* =====================================================
   INIT
===================================================== */

const container = document.getElementById('container');
const tabs = document.getElementById('tabs');

document.getElementById('mainTitle').innerText = FORM_CONFIG.title;

renderTabs();
renderSections();
updateProgress();

/* =====================================================
   RENDER TABS
===================================================== */

function renderTabs(){

  FORM_CONFIG.sections.forEach((section,index)=>{

    const btn = document.createElement('button');

    btn.className = 'tab-btn' + (index===0 ? ' active' : '');
    btn.innerText = section.title;

    btn.onclick = ()=>openSection(section.id,btn);

    tabs.appendChild(btn);

  });
}

/* =====================================================
   RENDER SECTIONS
===================================================== */

function renderSections(){

  FORM_CONFIG.sections.forEach((section,index)=>{

    const div = document.createElement('div');

    div.className = 'section' + (index===0 ? ' active' : '');
    div.id = section.id;

    const card = document.createElement('div');
    card.className = 'card';

    const h2 = document.createElement('h2');
    h2.innerText = section.title;

    card.appendChild(h2);

    section.questions.forEach(q=>{

      const qDiv = document.createElement('div');
      qDiv.className = 'question';

      let codeHtml = '';

      if(q.icd11){
        codeHtml = `<span class="code-badge">ICD-11: ${q.icd11}</span>`;
      }

      qDiv.innerHTML += `

<div class="question-title">

  ${q.text}

  ${q.info ? `
    <span class="info-btn"
      onclick='showInfo(${JSON.stringify(q.info)})'>
      [?]
    </span>
  ` : ""}

  ${codeHtml}

</div>

      `;

      qDiv.appendChild(createInput(q));

      card.appendChild(qDiv);

    });

    if(section.freeText){

      const notes = document.createElement('div');
      notes.className = 'section-notes';

      notes.innerHTML = `
        <label>Extra opmerkingen - ${section.title}</label>
        <textarea id="notes_${section.id}"></textarea>
      `;

      card.appendChild(notes);
    }

    const btnRow = document.createElement('div');
    btnRow.className = 'button-row no-print';

    btnRow.innerHTML = `
      <button class="action" onclick="showResults()">
        Resultaat
      </button>
    `;

    card.appendChild(btnRow);

    div.appendChild(card);

    container.appendChild(div);

  });
}

/* =====================================================
   CREATE INPUTS
===================================================== */

function createInput(q){

  const wrapper = document.createElement('div');

  if(q.type === 'text'){

    wrapper.innerHTML = `
      <input type="text" id="${q.id}">
    `;
  }

  else if(q.type === 'number'){

    wrapper.innerHTML = `
      <input type="number" id="${q.id}">
    `;
  }

  else if(q.type === 'date'){

    wrapper.innerHTML = `
      <input type="date" id="${q.id}">
    `;
  }

  else if(q.type === 'textarea'){

    wrapper.innerHTML = `
      <textarea id="${q.id}"></textarea>
    `;
  }

  else if(q.type === 'select'){

    let html = `<select id="${q.id}">`;

    html += `<option value=""></option>`;

    q.options.forEach(opt=>{
      html += `<option value="${opt}">${opt}</option>`;
    });

    html += `</select>`;

    wrapper.innerHTML = html;
  }

else if(q.type === 'radio'){

  q.options.forEach(opt=>{

    wrapper.innerHTML += `
      <label class="option-label">
        <input type="radio"
               name="${q.id}"
               value="${opt}">
        ${opt}
      </label>
    `;
  });
}

else if(q.type === 'presence'){

  const options = [
    'Aanwezig',
    'Niet aanwezig',
    'Niet vastgesteld'
  ];

  options.forEach(opt=>{

    wrapper.innerHTML += `
      <label class="option-label">
        <input type="radio"
               name="${q.id}"
               value="${opt}">
        ${opt}
      </label>
    `;
  });
}

  return wrapper;
}

/* =====================================================
   OPEN SECTION
===================================================== */

function openSection(id,btn){

  document.querySelectorAll('.section')
    .forEach(s=>s.classList.remove('active'));

  document.querySelectorAll('.tab-btn')
    .forEach(b=>b.classList.remove('active'));

  document.getElementById(id)
    .classList.add('active');

  btn.classList.add('active');

  window.scrollTo({top:0,behavior:'smooth'});
}

/* =====================================================
   PROGRESS
===================================================== */

function updateProgress(){

  const total = FORM_CONFIG.sections
    .flatMap(s=>s.questions).length;

  let done = 0;

  FORM_CONFIG.sections.forEach(section=>{

    section.questions.forEach(q=>{

      const value = getAnswer(q);

      if(value !== '' && value !== false && value !== null){
        done++;
      }
    });
  });

  const pct = Math.round((done / total) * 100);

  const bar = document.getElementById('progressBar');

  bar.style.width = pct + '%';
  bar.innerText = pct + '%';
}

/* =====================================================
   GET ANSWER
===================================================== */

function getAnswer(q){

  if(q.type === 'text' ||
     q.type === 'number' ||
     q.type === 'date' ||
     q.type === 'textarea' ||
     q.type === 'select'){

    return document.getElementById(q.id).value;
  }

  if(q.type === 'presence'){

    const checked = document.querySelector(`input[name="${q.id}"]:checked`);

    return checked ? checked.value : '';
  }

  if(q.type === 'radio'){

    const checked = document.querySelector(`input[name="${q.id}"]:checked`);

    return checked ? checked.value : '';
  }

  return '';
}

/* =====================================================
   EVENTS
===================================================== */

document.addEventListener('change',()=>{
  updateProgress();
  updateCompletedTabs();
});

/* =====================================================
   COMPLETED TABS
===================================================== */

function updateCompletedTabs(){

  FORM_CONFIG.sections.forEach((section,index)=>{

    let completed = true;

    section.questions.forEach(q=>{

      const value = getAnswer(q);

      if(value === '' || value === null){
        completed = false;
      }
    });

    const btn = document.querySelectorAll('.tab-btn')[index];

    if(completed){
      btn.classList.add('completed');
    }
    else{
      btn.classList.remove('completed');
    }
  });
}

/* =====================================================
   RESULTS
===================================================== */

function showResults(){

  const data = collectData();

  const w = window.open('', '_blank');

  w.document.write(buildReportHtml(data));

  w.document.close();
}

/* =====================================================
   COLLECT DATA
===================================================== */

function collectData(){

  const output = {
    title: FORM_CONFIG.title,
    sections: []
  };

  FORM_CONFIG.sections.forEach(section=>{

    const sec = {
      title: section.title,
      notes: '',
      questions: []
    };

    section.questions.forEach(q=>{

      sec.questions.push({
        text: q.text,
        answer: getAnswer(q),
        icd11: q.icd11 || ''
      });
    });

    if(section.freeText){
      sec.notes = document.getElementById(`notes_${section.id}`).value;
    }

    output.sections.push(sec);
  });

  return output;
}

/* =====================================================
   REPORT HTML
===================================================== */

function buildReportHtml(data){

  const today = getEuropeanDate();

  const patientName = document.getElementById('naam')
    ? document.getElementById('naam').value
    : '';

  const pdfTitle = buildPdfTitle(
    FORM_CONFIG.pdfPrefix,
    patientName,
    today
  );

  let sectionsHtml = '';

  data.sections.forEach(section=>{

    sectionsHtml += `
      <div class="section-block">
        <h2>${section.title}</h2>
    `;

    section.questions.forEach(q=>{

      sectionsHtml += `
        <div class="question-block">
          <div><strong>Vraag:</strong> ${q.text}</div>
          <div><strong>Antwoord:</strong> ${formatAnswer(q.answer)}</div>
          ${q.icd11 ? `<div><strong>ICD-11:</strong> ${q.icd11}</div>` : ''}
        </div>
      `;
    });

    if(section.notes){

      sectionsHtml += `
        <div class="notes-block">
          Extra opmerkingen<br>
          ${escapeHtml(section.notes).replace(/\n/g,'<br>')}
        </div>
      `;
    }

    sectionsHtml += `</div>`;
  });

  return `
  <html>
  <head>
  <title>${pdfTitle}</title>

  <style>

  body{
    font-family:Arial,sans-serif;
    padding:20px;
    line-height:1.4;
    color:#222;
  }

  h1{
    color:#1f4d7a;
  }

  h2{
    color:#2e7d32;
    margin-top:30px;
    border-bottom:1px solid #ccc;
    padding-bottom:5px;
  }

  .question-block{
    margin-bottom:12px;
    padding:10px;
    background:#f8f8f8;
    border-left:4px solid #468CD2;
  }

  .notes-block{
    margin-top:12px;
    padding:10px;
    background:#fffbe8;
    border-left:4px solid #f0ad00;
  }

  button{
    background:#1f4d7a;
    color:white;
    border:none;
    padding:12px 18px;
    border-radius:8px;
    cursor:pointer;
  }

  @media print{
    button{
      display:none;
    }
  }

  </style>

  </head>

  <body>

  <h1>${FORM_CONFIG.title}</h1>

  <div>
    <strong>Datum:</strong> ${today}
  </div>

  <hr>

  ${sectionsHtml}

  <hr>

  <button onclick="window.print()">
    Opslaan als PDF
  </button>

  </body>
  </html>
  `;
}

/* =====================================================
   HELPERS
===================================================== */

function formatAnswer(answer){

  if(answer === ''){
    return 'Niet ingevuld';
  }

  if(answer === 'Niet vastgesteld'){
    return 'Niet vastgesteld';
  }

  if(answer === 'Niet aanwezig'){
    return 'Niet aanwezig';
  }

  if(answer === 'Aanwezig'){
    return 'Aanwezig';
  }

  return escapeHtml(String(answer));
}

function buildPdfTitle(prefix,name,date){

  let code = (name || '')
    .replace(/[^A-Za-z]/g,'')
    .toUpperCase()
    .substring(0,4);

  if(code.length < 4){
    code = code.padEnd(4,'X');
  }

  return `${prefix} ${code} ${date}`;
}

function getEuropeanDate(){

  const d = new Date();

  const day = String(d.getDate()).padStart(2,'0');
  const month = String(d.getMonth()+1).padStart(2,'0');
  const year = d.getFullYear();

  return `${day}-${month}-${year}`;
}

function escapeHtml(text){

  const div = document.createElement('div');

  div.innerText = text;

  return div.innerHTML;
}


function showInfo(text){

  document.getElementById('infoText').innerHTML = text;

  document.getElementById('infoModal').style.display = 'block';

}

function closeInfo(){

  document.getElementById('infoModal').style.display = 'none';

}

document.getElementById('infoModal')
  .addEventListener('click', closeInfo);

</script>

<div class="info-modal" id="infoModal">

  <div class="info-modal-content">

    <span class="info-close"
      onclick="closeInfo()">
      ×
    </span>

    <div class="info-text" id="infoText"></div>

  </div>

</div>



</body>
</html>
