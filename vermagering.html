/* =====================================================
   CREATE INPUTS
===================================================== */

function createInput(q){

  const wrapper = document.createElement('div');

  if(q.type === 'text'){

    wrapper.innerHTML = `
      <input type="text" id="${q.id}">
    `;
  }

  else if(q.type === 'number'){

    wrapper.innerHTML = `
      <input type="number" id="${q.id}">
    `;
  }

else if(q.type === 'birth8'){

  wrapper.innerHTML = `
    <input
      type="text"
      id="${q.id}"
      maxlength="10"
      inputmode="numeric"
	  placeholder="ddmm / jjjj"
    >
  `;
}

else if(q.type === 'readonly'){

  wrapper.innerHTML = `
    <input
      type="text"
      id="${q.id}"
      readonly
    >
  `;
}

  else if(q.type === 'textarea'){

    wrapper.innerHTML = `
      <textarea id="${q.id}"></textarea>
    `;
  }

  else if(q.type === 'select'){

    let html = `<select id="${q.id}">`;

    html += `<option value=""></option>`;

    q.options.forEach(opt=>{
      html += `<option value="${opt}">${opt}</option>`;
    });

    html += `</select>`;

    wrapper.innerHTML = html;
  }

else if(q.type === 'radio'){

  q.options.forEach(opt=>{

    wrapper.innerHTML += `
      <label class="option-label">
        <input type="radio"
               name="${q.id}"
               value="${opt}">
        ${opt}
      </label>
    `;
  });
}

else if(q.type === 'checkbox'){

  q.options.forEach(opt=>{

    wrapper.innerHTML += `
      <label class="option-label">
        <input type="checkbox"
               name="${q.id}"
               value="${opt}">
        ${opt}
      </label>
    `;
  });
}

else if(q.type === 'presence'){

  const options = [
    'Aanwezig',
    'Niet aanwezig',
    'Niet vastgesteld'
  ];

  options.forEach(opt=>{

    wrapper.innerHTML += `
      <label class="option-label">
        <input type="radio"
               name="${q.id}"
               value="${opt}">
        ${opt}
      </label>
    `;
  });
}

else if(q.type === 'nan'){

  const options = [
    'Normaal',
    'Afwijkend',
    'Niet uitgevoerd'
  ];

  options.forEach(opt=>{

    wrapper.innerHTML += `
      <label class="option-label">
        <input type="radio"
               name="${q.id}"
               value="${opt}">
        ${opt}
      </label>
    `;
  });
}

  return wrapper;
}

/* =====================================================
   CALCULATE AGE
===================================================== */

function calculateAge(){

  const dob = document.getElementById('geboortedatum');

  if(!dob || !dob.value) return;

  const parts = dob.value.split('/');

  if(parts.length !== 3) return;

  const day   = parseInt(parts[0],10);
  const month = parseInt(parts[1],10)-1;
  const year  = parseInt(parts[2],10);

  const birthDate = new Date(year,month,day);

  if(isNaN(birthDate.getTime())) return;

  const today = new Date();

  const diffDays =
    (today - birthDate) / (1000 * 60 * 60 * 24);

  const ageDecimal =
    (diffDays / 365.25).toFixed(1);

  document.getElementById('leeftijd').value =
    ageDecimal.replace('.',',') + ' jaar';
}

/* =====================================================
   OPEN SECTION
===================================================== */

function openSection(id,btn){

  document.querySelectorAll('.section')
    .forEach(s=>s.classList.remove('active'));

  document.querySelectorAll('.tab-btn')
    .forEach(b=>b.classList.remove('active'));

  document.getElementById(id)
    .classList.add('active');

  btn.classList.add('active');

  window.scrollTo({top:0,behavior:'smooth'});
}

/* =====================================================
   PROGRESS
===================================================== */

function updateProgress(){

  const total = FORM_CONFIG.sections
    .flatMap(s=>s.questions).length;

  let done = 0;

  FORM_CONFIG.sections.forEach(section=>{

    section.questions.forEach(q=>{

      const value = getAnswer(q);

      if(value !== '' && value !== false && value !== null){
        done++;
      }
    });
  });

  const pct = Math.round((done / total) * 100);

  const bar = document.getElementById('progressBar');

  bar.style.width = pct + '%';
  bar.innerText = pct + '%';
}

/* =====================================================
   GET ANSWER
===================================================== */

function getAnswer(q){

if(
     q.type === 'text' ||
     q.type === 'number' ||
     q.type === 'date' ||
     q.type === 'birth8' ||
     q.type === 'readonly' ||
     q.type === 'textarea' ||
     q.type === 'select'
){
    return document.getElementById(q.id).value;
}

  if(q.type === 'presence'){

    const checked = document.querySelector(`input[name="${q.id}"]:checked`);

    return checked ? checked.value : '';
  }

  if(q.type === 'radio'){

    const checked = document.querySelector(`input[name="${q.id}"]:checked`);

    return checked ? checked.value : '';
  }

  if(q.type === 'checkbox'){

    const checked = document.querySelectorAll(`input[name="${q.id}"]:checked`);

    return Array.from(checked).map(el => el.value);
  }

  return '';
}


/* =====================================================
   EVENTS
===================================================== */

document.addEventListener('change',()=>{
  updateProgress();
  updateCompletedTabs();
  calculateAge();
});

document.addEventListener('input', function(e){

  if(e.target.id !== 'geboortedatum') return;

  let v = e.target.value.replace(/\D/g,'');

  if(v.length > 2)
    v = v.slice(0,2) + '/' + v.slice(2);

  if(v.length > 5)
    v = v.slice(0,5) + '/' + v.slice(5);

  e.target.value = v;

  calculateAge();

});



/* =====================================================
   COMPLETED TABS
===================================================== */

function updateCompletedTabs(){

  FORM_CONFIG.sections.forEach((section,index)=>{

    let completed = true;

    section.questions.forEach(q=>{

      const value = getAnswer(q);

      if(value === '' || value === null){
        completed = false;
      }

      // extra check voor lege checkbox arrays
      if(Array.isArray(value) && value.length === 0){
        completed = false;
      }

    });

    const btn = document.querySelectorAll('.tab-btn')[index];

    if(completed){
      btn.classList.add('completed');
    }
    else{
      btn.classList.remove('completed');
    }

  });
}

const w = window.open('', '_blank', 'width=1000,height=900');

/* =====================================================
   COLLECT DATA
===================================================== */

function collectData(){

  const output = {
    title: FORM_CONFIG.title,
    sections: []
  };

  FORM_CONFIG.sections.forEach(section=>{

    const sec = {
      title: section.title,
      notes: '',
      questions: []
    };

    section.questions.forEach(q=>{

      sec.questions.push({
        text: q.text,
        answer: getAnswer(q),
        icd11: q.icd11 || ''
      });
    });

    if(section.freeText){
      sec.notes = document.getElementById(`notes_${section.id}`).value;
    }

    output.sections.push(sec);
  });

  return output;
}

/* =====================================================
   HELPERS
===================================================== */

function formatAnswer(answer){

  if(answer == null || answer === ''){
    return 'Niet ingevuld';
  }

  if(Array.isArray(answer)){

    if(answer.length === 0){
      return 'Niet ingevuld';
    }

    return answer
      .map(a => escapeHtml(String(a)))
      .join(', ');
  }

  return escapeHtml(String(answer));
}

function buildPdfTitle(prefix,name,date){
  let code = (name || '')
    .replace(/[^A-Za-z]/g,'')
    .toUpperCase()
    .substring(0,4);
  if(code.length < 4){ code = code.padEnd(4,'X'); }
  return `${prefix} ${code} ${date}`;
}

function getEuropeanDate(){
  const d = new Date();
  const day = String(d.getDate()).padStart(2,'0');
  const month = String(d.getMonth()+1).padStart(2,'0');
  const year = d.getFullYear();
  return `${day}-${month}-${year}`;
}

function escapeHtml(text){
  const div = document.createElement('div');
  div.innerText = text;
  return div.innerHTML;
}

function showInfo(text){
  document.getElementById('infoText').innerHTML = text;
  document.getElementById('infoModal').style.display = 'block';
}

function closeInfo(){
  document.getElementById('infoModal').style.display = 'none';
}

window.addEventListener('load', function(){
  document.getElementById('infoModal')
    .addEventListener('click', function(e){ if(e.target === this)
	{ closeInfo(); }
	  
});

});
