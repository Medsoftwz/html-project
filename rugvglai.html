body{

.header{

h1{ margin:0; text-align:center; color:#1f4d7a; font-size:16px; font-weight: 400;}
h2{ color:#349d1d; font-size:15px; border-bottom:2px solid #d9e2ec; padding-bottom:6px; font-weight: 400; }

.disclaimer{ margin-top:6px; text-align:center; font-size:11px; color:#666; line-height:1.4; }

.tabs{

.tab-btn{

.tab-btn.active{ background:#00C000; }
.tab-btn.completed{ background:#A56363 }

.info-btn{

  cursor:pointer;
  font-weight:bold;
  margin-left:6px;
  font-size:14px;
}

.info-btn:hover{ color:#0d47a1; }

.info-modal{
  display:none;
  position:fixed;
  z-index:99999;
  left:0;
  top:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.35);
}

.info-modal-content{
  background:#fffde7;

  margin:4vh auto;
  padding:10px 20px 20px 20px;
  border-radius:10px;
  box-shadow:0 4px 18px rgba(0,0,0,0.25);
  position:relative;
}

.info-close{
  position:absolute;
  right:10px;
  top:6px;
  font-size:20px;
  cursor:pointer;
  color:#666;
}

.info-text{
  color:#003c7a;
  line-height:1.5;
  white-space:pre-line;
  font-size:14px;
}

.container{ max-width:1100px; margin:auto; padding:12px; }

.section{ display:none; }
.section.active{ display:block; }

.card{
  background:white;
  border-radius:10px;
  padding:14px;
  margin-bottom:12px;
  box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

.question{ margin-bottom:20px; }
.question-title{ font-weight:500; color:#003c7a; margin-bottom:10px; font-size:15px; }
.question-subtitle{ font-size:12px; color:#666; margin-top:4px; }

label{ display:block; margin:8px 0; font-size:15px; color:#222; }

.option-label{
  display:block;
  margin:3px 0;
  font-size:14px;
  color:#800040;
  line-height:1.0;

input[type="text"],
input[type="number"],
input[type="date"]{
  width:30%;
  box-sizing:border-box;
  padding:10px;
  border:1px solid #ccc;
  border-radius:6px;
  font-size:14px;

textarea{
  width:90%;
  min-height:140px;
  box-sizing:border-box;
  padding:10px;
  border:1px solid #ccc;
  border-radius:6px;
  font-size:15px;
  line-height:1.5;
  resize:vertical;

select{
  width:220px;
  padding:8px;
  border:1px solid #ccc;
  border-radius:6px;
  font-size:14px;

textarea{ min-height:100px; resize:vertical; }

.section-notes{ margin-top:18px; }
.section-notes textarea{ background:#fffef6; }

.button-row{
  display:flex;

  gap:10px;
  justify-content:center;

button.action{
  border:none;
  background:#1f4d7a;
  color:white;
  padding:12px 18px;
  border-radius:8px;

button.action:hover{ background:#295f95; }

.progress-wrap{
  position:fixed;
  left:0;
  bottom:0;
  width:100%;
  height:24px;
  background:#ddd;
}

.progress-bar{
  height:100%;
  width:0%;
  background:#2e7d32;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:0.3s;
  font-size:12px;
  font-weight:bold;

.code-badge{
  display:inline-block;
  background:#eef4ff;
  color:#1d4f91;
  border-radius:4px;
  padding:2px 6px;
  font-size:11px;
  margin-left:6px;

@media print{
  .no-print{

/* =====================================================
   CREATE INPUTS
===================================================== */

function createInput(q){
  const wrapper = document.createElement('div');
if(q.type === 'text'){

  wrapper.innerHTML = `
    <input 
      type="text"
      id="${q.id}"
      placeholder="${q.placeholder || ''}"
    >
  `;
}

  else if(q.type === 'number'){
    wrapper.innerHTML = `
      <input type="number" id="${q.id}">
    `;
  }

else if(q.type === 'date'){
  wrapper.innerHTML = `
    <input 
      type="date"
      id="${q.id}"
    >
  `;
}

else if(q.type === 'readonly'){
  wrapper.innerHTML = `
    <input 
      type="text"
      id="${q.id}"
      readonly
    >
  `;
}

else if(q.type === 'textarea'){
  wrapper.innerHTML = `
    <textarea
      id="${q.id}"
      placeholder="${q.placeholder || ''}"
    ></textarea>
  `;
}

  else if(q.type === 'select'){
    let html = `<select id="${q.id}">`;
    html += `<option value=""></option>`;
    q.options.forEach(opt=>{
      html += `<option value="${opt}">${opt}</option>`;
    });

    html += `</select>`;
    wrapper.innerHTML = html;
  }

else if(q.type === 'radio'){
  q.options.forEach(opt=>{
    wrapper.innerHTML += `
      <label class="option-label">
        <input type="radio"
               name="${q.id}"
               value="${opt}">
        ${opt}
      </label>
    `;
  });
}

else if(q.type === 'checkbox'){
  q.options.forEach(opt=>{
    wrapper.innerHTML += `
      <label class="option-label">
        <input type="checkbox"
               name="${q.id}"
               value="${opt}">
        ${opt}
      </label>
    `;
  });
}

else if(q.type === 'presence'){

  const options = [
    'Aanwezig',
    'Niet aanwezig',
    'Niet vastgesteld'
  ];

  options.forEach(opt=>{

    wrapper.innerHTML += `
      <label class="option-label">
        <input type="radio"
               name="${q.id}"
               value="${opt}">
        ${opt}
      </label>
    `;
  });
}

else if(q.type === 'nan'){
  const options = [
    'Normaal',
    'Afwijkend',
    'Niet uitgevoerd'
  ];

  options.forEach(opt=>{
    wrapper.innerHTML += `
      <label class="option-label">
        <input type="radio"
               name="${q.id}"
               value="${opt}">
        ${opt}
      </label>
    `;
  });
}

  return wrapper;
}

/* =====================================================
   OPEN SECTION
===================================================== */

function openSection(id,btn){
  document.querySelectorAll('.section')
    .forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab-btn')
    .forEach(b=>b.classList.remove('active'));
  document.getElementById(id)
    .classList.add('active');
  btn.classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
}

/* =====================================================
   PROGRESS
===================================================== */

function updateProgress(){
  const total = FORM_CONFIG.sections
    .flatMap(s=>s.questions).length;
  let done = 0;
  FORM_CONFIG.sections.forEach(section=>{
    section.questions.forEach(q=>{
      const value = getAnswer(q);
      if(value !== '' && value !== false && value !== null){
        done++;
      }
    });
  });

  const pct = Math.round((done / total) * 100);
  const bar = document.getElementById('progressBar');
  bar.style.width = pct + '%';
  bar.innerText = pct + '%';
}

/* =====================================================
   GET ANSWER
===================================================== */

function getAnswer(q){

  if(q.type === 'text' ||
     q.type === 'number' ||
     q.type === 'date' ||
     q.type === 'textarea' ||
     q.type === 'select'){

    return document.getElementById(q.id).value;
  }

  if(q.type === 'presence'){
    const checked = document.querySelector(`input[name="${q.id}"]:checked`);
    return checked ? checked.value : '';
  }

  if(q.type === 'radio'){
    const checked = document.querySelector(`input[name="${q.id}"]:checked`);
    return checked ? checked.value : '';
  }

  if(q.type === 'checkbox'){
    const checked = document.querySelectorAll(`input[name="${q.id}"]:checked`);
    return Array.from(checked).map(el => el.value);
  }

  return '';
}


/* =====================================================
   CONDITIONALS
===================================================== */

function evaluateCondition(condition){

  try{

    // vb:
    // "infiltraties == 'Ja'"

    const match = condition.match(/^(.+?)\s*==\s*['"](.+?)['"]$/);
    if(!match) return false;
    const fieldId = match[1].trim();
    const expected = match[2].trim();

    // radio
    const radio = document.querySelector(
      `input[name="${fieldId}"]:checked`
    );
    if(radio){
      return radio.value === expected;
    }

    // gewone input/select/textarea
    const el = document.getElementById(fieldId);

    if(el){
      return el.value === expected;
    }
    return false;

  }catch(err){
    console.error('Conditional error:', err);
    return false;
  }
}

function updateConditionalQuestions(){

  document.querySelectorAll('[data-conditional]')
    .forEach(qDiv=>{
      const condition = qDiv.dataset.conditional;
      const visible = evaluateCondition(condition);
      qDiv.style.display = visible ? 'block' : 'none';
    });
}

        String(a)
          .toLowerCase()
          .trim()
          .includes(needle)
      );
    }

    return String(q.answer)
      .toLowerCase()
      .trim()
      .includes(needle);

  });
}

   }

  /* =========================
     Geen specifieke patronen
  ========================= */

  if(summary.length === 0)

/* =====================================================
   EVENTS
===================================================== */

document.addEventListener('change',(e)=>{
  const target = e.target;

  /* =========================
     Rode vlaggen exclusiviteit
  ========================= */

  if(
    target.name === 'red_flags' &&
    target.type === 'checkbox'
  ){

    const all =
      document.querySelectorAll(
        'input[name="red_flags"]'
      );

    const none =
      Array.from(all).find(
        cb => cb.value === 'Geen rode vlaggen'
      );

    /* =========================
       Indien "Geen rode vlaggen"
       wordt aangevinkt
    ========================= */

    if(
      target.value === 'Geen rode vlaggen' &&
      target.checked
    ){

      all.forEach(cb=>{

        if(cb !== none){
          cb.checked = false;
        }
      });
    }

    /* =========================
       Indien andere rode vlag
       wordt aangevinkt
    ========================= */

    else if(target.checked){

      none.checked = false;
    }
  }

  updateProgress();
  updateCompletedTabs();
  updateConditionalQuestions();
  calculateAge();

});

function calculateAge(){
  const dob = document.getElementById('geboortedatum');
  if(!dob || !dob.value) return;
  const birthDate = new Date(dob.value);
  const today = new Date();
  let age = today.getFullYear() - birthDate.getFullYear();
  const m = today.getMonth() - birthDate.getMonth();
  
  if(
    m < 0 ||
    (m === 0 && today.getDate() < birthDate.getDate())
  ){
    age--;
  }

  const ageField = document.getElementById('leeftijd');

  if(ageField){
    ageField.value = age + ' jaar';
  }
}


/* =====================================================
   COMPLETED TABS
===================================================== */

function updateCompletedTabs(){

  FORM_CONFIG.sections.forEach((section,index)=>{

    let completed = true;

    section.questions.forEach(q=>{

      const value = getAnswer(q);

      if(value === '' || value === null){
        completed = false;
      }

      // extra check voor lege checkbox arrays
      if(Array.isArray(value) && value.length === 0){
        completed = false;
      }

    });

    const btn = document.querySelectorAll('.tab-btn')[index];

    if(completed){
      btn.classList.add('completed');
    }
    else{
      btn.classList.remove('completed');
    }

  });
}

function showResults(){

  const redFlagsChecked =
    document.querySelectorAll(
      'input[name="red_flags"]:checked'
    );

  if(redFlagsChecked.length === 0){
    alert('Gelieve de rubriek "Pasop !" in te vullen.');
    return;
  }

  const pijnsoortChecked =
    document.querySelector(
      'input[name="pijnsoort"]:checked'
    );

  if(!pijnsoortChecked){
    alert('Gelieve "Onderzoek - Beoordeling soort pijn" in te vullen.');
    return;
  }

  const data = collectData();

  const w = window.open('', '_blank', 'width=1000,height=900');

  w.document.write(buildReportHtml(data));

  w.document.close();
}

/* =====================================================
   COLLECT DATA
===================================================== */

function collectData(){

  const output = {
    title: FORM_CONFIG.title,
    sections: []
  };

  FORM_CONFIG.sections.forEach(section=>{

    const sec = {
      title: section.title,
      notes: '',
      questions: []
    };

    section.questions.forEach(q=>{

      sec.questions.push({
        text: q.text,
        answer: getAnswer(q),
        icd11: q.icd11 || ''
      });
    });

    if(section.freeText){
      sec.notes = document.getElementById(`notes_${section.id}`).value;
    }

    output.sections.push(sec);
  });

  return output;
}

/* =====================================================
   HELPERS
===================================================== */

function formatAnswer(answer){

  if(answer == null || answer === ''){
    return 'Niet ingevuld';
  }

  if(Array.isArray(answer)){

    if(answer.length === 0){
      return 'Niet ingevuld';
    }

    return answer
      .map(a => escapeHtml(String(a)))
      .join(', ');
  }

  return escapeHtml(String(answer));
}

function buildPdfTitle(prefix,name,date){
  let code = (name || '')
    .replace(/[^A-Za-z]/g,'')
    .toUpperCase()
    .substring(0,4);
  if(code.length < 4){ code = code.padEnd(4,'X'); }
  return `${prefix} ${code} ${date}`;
}

function getEuropeanDate(){
  const d = new Date();
  const day = String(d.getDate()).padStart(2,'0');
  const month = String(d.getMonth()+1).padStart(2,'0');
  const year = d.getFullYear();
  return `${day}-${month}-${year}`;
}

function escapeHtml(text){
  const div = document.createElement('div');
  div.innerText = text;
  return div.innerHTML;
}

function showInfo(text){
  document.getElementById('infoText').innerHTML = text;
  document.getElementById('infoModal').style.display = 'block';
}

function closeInfo(){
  document.getElementById('infoModal').style.display = 'none';
}

});
