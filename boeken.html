let oplopend = true;
let actieveKolom = "";

function toonBoeken(){

    let filter =
        document.getElementById("zoek")
        .value.toLowerCase();

    let html = "";
    let gevonden = 0;

    boeken.forEach(b => {

        let tekst =
            (b.titel +
             b.vnaam +
             b.auteur +
             b.jaar +
             b.nota).toLowerCase();

        if(tekst.includes(filter)){

            gevonden++;

            html += `
            <tr>
                <td>${b.titel}</td>
                <td>${b.vnaam}</td>
                <td>${b.auteur}</td>
                <td>${b.jaar}</td>
                <td>${b.nota}</td>
            </tr>`;
        }
    });

    document.getElementById("teller").innerHTML =
        gevonden + " van " + boeken.length + " boeken";

    document.getElementById("boekenBody").innerHTML = html;
}

function sorteer(veld){

    if(actieveKolom === veld){
        oplopend = !oplopend;
    }
    else{
        oplopend = true;
        actieveKolom = veld;
    }

    boeken.sort((a,b)=>{

        let x = a[veld];
        let y = b[veld];

        if(veld==="jaar"){
            x = parseInt(x);
            y = parseInt(y);
        }

        if(oplopend){
            return x > y ? 1 : -1;
        }
        else{
            return x < y ? 1 : -1;
        }

    });

    updateKolomKoppen();
    toonBoeken();
}

function updateKolomKoppen(){

    document.querySelector(".colTitel").innerHTML =
        "Titel ⇅";

    document.querySelector(".colVnaam").innerHTML =
        "Vnaam ⇅";

    document.querySelector(".colAuteur").innerHTML =
        "Auteur ⇅";

    document.querySelector(".colJaar").innerHTML =
        "Jaar ⇅";

    document.querySelector(".colNota").innerHTML =
        "Extra ⇅";

    let pijl = oplopend ? " ▲" : " ▼";

    switch(actieveKolom){

        case "titel":
            document.querySelector(".colTitel").innerHTML =
                "Titel" + pijl;
            break;

        case "vnaam":
            document.querySelector(".colVnaam").innerHTML =
                "Vnaam" + pijl;
            break;

        case "auteur":
            document.querySelector(".colAuteur").innerHTML =
                "Auteur" + pijl;
            break;

        case "jaar":
            document.querySelector(".colJaar").innerHTML =
                "Jaar" + pijl;
            break;

        case "nota":
            document.querySelector(".colNota").innerHTML =
                "Extra" + pijl;
            break;
    }
}
