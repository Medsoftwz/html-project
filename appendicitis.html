===================================================== */

.header {

   TABS
===================================================== */

.tabs {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 4px;
}

.tablink {
  background: #468CD2;
  color: white;
  border: none;
  padding: 10px 14px;
  border-radius: 6px;
  cursor: pointer;
  transition: 0.3s;
}

.tablink.active { background: #3BAF17; }
.tablink.completed { background: #1f6f0e; }

/* =====================================================
   TAB CONTENT
===================================================== */

.tab-content { display: none; padding: 6px; }
.tab-content.active { display: block; }

   QUESTION BOX
===================================================== */

.question.active { border-width: 3px; }
.question.answered { opacity: 0.55; }

/* =====================================================
   OPEN TAB
===================================================== */

function openTab(id, button){

  document.querySelectorAll('.tab-content')
    .forEach(t => t.classList.remove('active'));

  document.querySelectorAll('.tablink')
    .forEach(b => b.classList.remove('active'));

  document.getElementById(id).classList.add('active');
  button.classList.add('active');

  window.scrollTo({ top:0, behavior:'smooth' });

}

/* =====================================================
   FLOW
===================================================== */

document.addEventListener('change', e => {

  if(!e.target.matches('input[type="radio"]')) return;

  const qDiv = e.target.closest('.question');
  const form = qDiv.parentElement;

  qDiv.classList.add('answered');
  qDiv.classList.remove('active');
  qDiv.classList.add('flash');

  setTimeout(() => {
    qDiv.classList.remove('flash');
  }, 350);

  updateProgress();

  const questions = [...form.querySelectorAll('.question')];
  const idx = questions.indexOf(qDiv);

  setTimeout(() => {

    if(idx < questions.length - 1){

      const next = questions[idx + 1];
      next.classList.add('active');

next.scrollIntoView({
  behavior:'smooth',
  block:'center'
});

    } else {

      markSectionCompleted(form.id);
      openNextTab(form.id);

    }

  }, 450);

});

/* =====================================================
   NEXT TAB
===================================================== */

function openNextTab(currentId){

  const keys = Object.keys(SECTIONS);
  const idx = keys.indexOf(currentId);

  if(idx >= keys.length - 1) return;

  const nextId = keys[idx + 1];
  const nextButton = document.querySelectorAll('.tablink')[idx + 1];

  openTab(nextId, nextButton);

}

/* =====================================================
   COMPLETED TAB
===================================================== */

function markSectionCompleted(sectionId){

  const section = document.getElementById(sectionId);
  const questions = section.querySelectorAll('.question');

  let done = true;

  questions.forEach(q => {
    if(!q.querySelector('input:checked')){
      done = false;
    }
  });

  if(done){

    const keys = Object.keys(SECTIONS);
    const idx = keys.indexOf(sectionId);

    const btn = document.querySelectorAll('.tablink')[idx];
    btn.classList.add('completed');

  }

}

/* =====================================================
   PROGRESS
===================================================== */

function updateProgress(){

  const total = document.querySelectorAll('.question').length;
  const done = document.querySelectorAll('input:checked').length;

  const pct = (done / total) * 100;

  const bar = document.getElementById('progressBar');

  bar.style.width = pct + '%';
  bar.innerText = Math.round(pct) + '%';

  if(pct < 25){
    bar.style.background = '#d32f2f';
  }
  else if(pct < 60){
    bar.style.background = '#f57c00';
  }
  else if(pct < 100){
    bar.style.background = '#c0ca33';
  }
  else {
    bar.style.background = '#2e7d32';
    document.getElementById('completionMessage')
      .classList.add('show');
  }

}

/* =====================================================
   BEREKEN SECTIE
===================================================== */

function calculateSection(sectionId){

  const section = SECTIONS[sectionId];
  const resultBox = document.getElementById(`result-${sectionId}`);

  let score = 0;
  let maxScore = 0;

  for(const q of section.questions){

    const selected = document.querySelector(
      `input[name="${q.id}"]:checked`
    );

    if(!selected){
      alert('Gelieve alle vragen te beantwoorden');
      return;
    }

    const value = selected.value;

    if(value !== "null"){

      score += parseInt(value);

      const highest = Math.max(
        ...q.options
          .filter(o => o.score !== null)
          .map(o => o.score)
      );

      maxScore += highest;

    }

  }

  const pct = maxScore > 0
    ? ((score / maxScore) * 100).toFixed(1)
    : 0;

  resultBox.innerText =
`Sectiescore: ${score} / ${maxScore}
Functiedaling: ${pct}%`;

}

  const item = section.interpretation.find(i =>
    pct >= i.min && pct < i.max

  return item ? item.text : '';

}

function autoFillTest(){

  document.querySelectorAll('.question').forEach(q => {

    const radios = [
      ...q.querySelectorAll('input[type="radio"]')
    ];

    const index = Math.floor(
      Math.random() * radios.length
    );

    radios[index].checked = true;

    radios[index].dispatchEvent(
      new Event('change', { bubbles:true })
    );

  });

  updateProgress();

}

function interpretationColor(pct){
  if(pct < 15){ return '#008450'; }
  else if(pct < 40){ return '#00C0C0'; }
  else if(pct < 80){ return '#FFA500'; }
  return '#E60000';
}

function appendicitisColor(score){

  if(score < 4){
    return '#008450';
  }
  else if(score < 7){
    return '#FFA500';
  }

  return '#E60000';
}

function appendicitisInterpretation(score){

  if(score < 4){

    return `
Lage waarschijnlijkheid van acute appendicitis.

Klinische herevaluatie blijft belangrijk.
Bij aanhoudende of toenemende klachten blijft medische beoordeling aangewezen.
    `;
  }

  else if(score < 7){

    return `
Intermediaire waarschijnlijkheid van acute appendicitis.

Uitsluiten van zwangerschap en urineweg infectie.
Aanvullend onderzoek zoals echografie of CT-scan kan overwogen worden afhankelijk van klinisch beeld, leeftijd en evolutie.
Klinische observatie en herevaluatie zijn belangrijk.
    `;
  }

  return `
Hoge waarschijnlijkheid van acute appendicitis.

Uitsluiten van zwangerschap en urineweg infectie.
Dringende medische evaluatie is aangewezen.
Beeldvorming of chirurgische evaluatie kan noodzakelijk zijn afhankelijk van het klinisch onderzoek.
  `;
}

function appendicitisRiskLabel(score){

  if(score < 4){
    return 'Lage waarschijnlijkheid';
  }
  else if(score < 7){
    return 'Intermediaire waarschijnlijkheid';
  }

  return 'Hoge waarschijnlijkheid';
}
