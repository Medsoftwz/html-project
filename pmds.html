===================================================== */

.tabs {

}

.tablink {
  background: #468CD2;

}

.tablink.active { background: #3BAF17; }

.tablink.completed { background: #1f6f0e; }

/* =====================================================
   TAB CONTENT
===================================================== */

  display: none;
  padding: 6px;

===================================================== */

  const btn = document.createElement("button");
  btn.className = "tablink" + (index === 0 ? " active" : "");
  btn.innerText = section.title;

  btn.onclick = (e) => {
    openTab(key, btn);
  };

  tabs.appendChild(btn);

/* =====================================================
   RENDER CONTENT
===================================================== */

Object.entries(SECTIONS).forEach(([key, section], index) => {

  const div = document.createElement("div");
  div.className = "tab-content" + (index === 0 ? " active" : "");
  div.id = key;

  section.questions.forEach((q, qi) => {

    const block = document.createElement("div");
    block.className = "question" + (qi === 0 ? " active" : "");

    block.innerHTML = `

      <div class="q-text">${q.text}</div>

      <div class="q-options">
        ${q.options.map(o => `
          <label>
            <input type="radio" name="${q.id}" value="${o.score}">
            ${o.label}
          </label>
        `).join("")}
      </div>

    `;

    div.appendChild(block);

  });

  const buttonArea = document.createElement("div");
  buttonArea.className = "section-buttons";

  buttonArea.innerHTML = `
    <button class="action-btn" onclick="calculateSection('${key}')">
      Bereken Sectie
    </button>

    <button class="action-btn" onclick="showResults()">
      Resultaat
    </button>
  `;

  div.appendChild(buttonArea);

  const resultBox = document.createElement("div");
  resultBox.className = "result-box";
  resultBox.id = `result-${key}`;

  div.appendChild(resultBox);

  container.appendChild(div);

});

/* =====================================================
   OPEN TAB
===================================================== */

function openTab(id, button){

  document.querySelectorAll('.tab-content')
    .forEach(t => t.classList.remove('active'));

  document.querySelectorAll('.tablink')
    .forEach(b => b.classList.remove('active'));

  document.getElementById(id).classList.add('active');
  button.classList.add('active');

  window.scrollTo({ top:0, behavior:'smooth' });

}

/* =====================================================
   FLOW
===================================================== */

document.addEventListener('change', e => {

  if(!e.target.matches('input[type="radio"]')) return;

  const qDiv = e.target.closest('.question');
  const form = qDiv.parentElement;

  qDiv.classList.add('answered');
  qDiv.classList.remove('active');
  qDiv.classList.add('flash');

  setTimeout(() => {
    qDiv.classList.remove('flash');
  }, 350);

  updateProgress();

  const questions = [...form.querySelectorAll('.question')];
  const idx = questions.indexOf(qDiv);

  setTimeout(() => {

    if(idx < questions.length - 1){

      const next = questions[idx + 1];
      next.classList.add('active');

next.scrollIntoView({
  behavior:'smooth',
  block:'center'
});

    } else {

      markSectionCompleted(form.id);
      openNextTab(form.id);

    }

  }, 450);

});

/* =====================================================
   NEXT TAB
===================================================== */

function openNextTab(currentId){

  const keys = Object.keys(SECTIONS);
  const idx = keys.indexOf(currentId);

  if(idx >= keys.length - 1) return;

  const nextId = keys[idx + 1];
  const nextButton = document.querySelectorAll('.tablink')[idx + 1];

  openTab(nextId, nextButton);

}

/* =====================================================
   COMPLETED TAB
===================================================== */

function markSectionCompleted(sectionId){

  const section = document.getElementById(sectionId);
  const questions = section.querySelectorAll('.question');

  let done = true;

  questions.forEach(q => {
    if(!q.querySelector('input:checked')){
      done = false;
    }
  });

  if(done){

    const keys = Object.keys(SECTIONS);
    const idx = keys.indexOf(sectionId);

    const btn = document.querySelectorAll('.tablink')[idx];
    btn.classList.add('completed');

  }

}

/* =====================================================
   PROGRESS
===================================================== */

function updateProgress(){

  const total = document.querySelectorAll('.question').length;
  const done = document.querySelectorAll('input:checked').length;

  const pct = (done / total) * 100;

  const bar = document.getElementById('progressBar');

  bar.style.width = pct + '%';
  bar.innerText = Math.round(pct) + '%';

  if(pct < 25){
    bar.style.background = '#d32f2f';
  }
  else if(pct < 60){
    bar.style.background = '#f57c00';
  }
  else if(pct < 100){
    bar.style.background = '#c0ca33';
  }
  else {
    bar.style.background = '#2e7d32';
    document.getElementById('completionMessage')
      .classList.add('show');
  }

}

/* =====================================================
   BEREKEN SECTIE
===================================================== */

function calculateSection(sectionId){

  const section = SECTIONS[sectionId];
  const resultBox = document.getElementById(`result-${sectionId}`);

  let score = 0;
  let maxScore = 0;

  for(const q of section.questions){

    const selected = document.querySelector(`input[name="${q.id}"]:checked`);

    if(!selected){
      alert('Gelieve alle vragen te beantwoorden');
      return;
    }

    score += parseInt(selected.value);

    const highest = Math.max(...q.options.map(o => o.score));
    maxScore += highest;

  }

  const pct = ((score / maxScore) * 100).toFixed(1);

  resultBox.innerText =
`Sectiescore: ${score} / ${maxScore}
Functiedaling: ${pct}%`;

}

/* =====================================================
   INTERPRETATIE
===================================================== */

function getInterpretation(section, pct){

  const item = section.interpretation.find(i =>
    pct >= i.min && pct < i.max
  );

  return item ? item.text : '';

}

/* =====================================================
   RESULTATEN
===================================================== */

  const totalQuestions = document.querySelectorAll('.question').length;
  const totalAnswers = document.querySelectorAll('input:checked').length;

  if(totalQuestions !== totalAnswers){
    alert('Gelieve alle vragen te beantwoorden');
    return;
  }

  let totalScore = 0;
  let totalMax = 0;

  let html = '';
  let answersHtml = '';

  Object.entries(SECTIONS).forEach(([key, section]) => {

    let sectionScore = 0;
    let sectionMax = 0;

    section.questions.forEach(q => {

      const selected = document.querySelector(`input[name="${q.id}"]:checked`);

      sectionScore += parseInt(selected.value);

      const max = Math.max(...q.options.map(o => o.score));
      sectionMax += max;

      const label = selected.parentElement.innerText.trim();

      const questionText = q.text;

      answersHtml += `
        <div style="margin-bottom:8px;">
          <strong>${questionText}</strong><br>
          ${label} (${selected.value})
        </div>
      `;

    });

    totalScore += sectionScore;
    totalMax += sectionMax;

    const pct = ((sectionScore / sectionMax) * 100);

    html += `
      <div style="margin-bottom:10px;">
        <strong>${section.title}</strong><br>
        ${sectionScore} / ${sectionMax}<br>
        ${pct.toFixed(1)}%<br>
        ${getInterpretation(section, pct)}
      </div>
    `;

  });

  const totalPct = ((totalScore / totalMax) * 100).toFixed(1);

  const totalInterpretation = getInterpretation(
    { interpretation: CONFIG.totalInterpretation },
    parseFloat(totalPct)
  );

function formatDateEU(iso){
  if(!iso) return "";
  if(iso.includes("/")) return iso;

  const [y,m,d] = iso.split("-");
  return `${d}-${m}-${y}`;
}

  let code = (name || "")
    .replace(/[^a-zA-Z]/g, '')
    .toUpperCase()
    .substring(0,4);

  if(code.length < 4){
    code = code.padEnd(4,'X');
  }

  return `resultaat ${code} ${date}`;
}
