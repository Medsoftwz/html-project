/* =====================================================
   RENDER TABS
===================================================== */

function renderTabs(){

  FORM_CONFIG.sections.forEach((section,index)=>{

    const btn = document.createElement('button');

    btn.className = 'tab-btn' + (index===0 ? ' active' : '');
    btn.innerText = section.title;

    btn.onclick = ()=>openSection(section.id,btn);

    tabs.appendChild(btn);

  });
}

/* =====================================================
   RENDER SECTIONS
===================================================== */

function renderSections(){

  FORM_CONFIG.sections.forEach((section,index)=>{

    const div = document.createElement('div');

    div.className = 'section' + (index===0 ? ' active' : '');
    div.id = section.id;

    const card = document.createElement('div');
    card.className = 'card';

    const h2 = document.createElement('h2');
    h2.innerText = section.title;

    card.appendChild(h2);

    section.questions.forEach(q=>{

      const qDiv = document.createElement('div');
      qDiv.className = 'question';

      let codeHtml = '';

      if(q.icd11){
        codeHtml = `<span class="code-badge">ICD-11: ${q.icd11}</span>`;
      }

      qDiv.innerHTML += `

<div class="question-title">

  ${q.text}

  ${q.info ? `
    <span class="info-btn"
      onclick='showInfo(${JSON.stringify(q.info)})'>
      [?]
    </span>
  ` : ""}

  ${codeHtml}

</div>

      `;

      qDiv.appendChild(createInput(q));

      card.appendChild(qDiv);

    });

    if(section.freeText){

      const notes = document.createElement('div');
      notes.className = 'section-notes';

      notes.innerHTML = `
        <label>Extra opmerkingen & Relevante bevindingen - ${section.title}</label>
        <textarea id="notes_${section.id}"></textarea>
      `;

      card.appendChild(notes);
    }

    const btnRow = document.createElement('div');
    btnRow.className = 'button-row no-print';

    btnRow.innerHTML = `
      <button class="action" onclick="showResults()">
        Resultaat
      </button>
    `;

    card.appendChild(btnRow);

    div.appendChild(card);

    container.appendChild(div);

  });
}

/* =====================================================
   CREATE INPUTS
===================================================== */

function createInput(q){

  const wrapper = document.createElement('div');

  if(q.type === 'text'){

    wrapper.innerHTML = `
      <input type="text" id="${q.id}">
    `;
  }

  else if(q.type === 'number'){

    wrapper.innerHTML = `
      <input type="number" id="${q.id}">
    `;
  }

else if(q.type === 'date'){

  wrapper.innerHTML = `
    <input 
      type="text"
      id="${q.id}"
      placeholder="dd-mm-jjjj"
      inputmode="numeric"
    >
  `;
}

  else if(q.type === 'textarea'){

    wrapper.innerHTML = `
      <textarea id="${q.id}"></textarea>
    `;
  }

  else if(q.type === 'select'){

    let html = `<select id="${q.id}">`;

    html += `<option value=""></option>`;

    q.options.forEach(opt=>{
      html += `<option value="${opt}">${opt}</option>`;
    });

    html += `</select>`;

    wrapper.innerHTML = html;
  }

else if(q.type === 'radio'){

  q.options.forEach(opt=>{

    wrapper.innerHTML += `
      <label class="option-label">
        <input type="radio"
               name="${q.id}"
               value="${opt}">
        ${opt}
      </label>
    `;
  });
}

else if(q.type === 'checkbox'){

  q.options.forEach(opt=>{

    wrapper.innerHTML += `
      <label class="option-label">
        <input type="checkbox"
               name="${q.id}"
               value="${opt}">
        ${opt}
      </label>
    `;
  });
}

else if(q.type === 'presence'){

  const options = [
    'Aanwezig',
    'Niet aanwezig',
    'Niet vastgesteld'
  ];

  options.forEach(opt=>{

    wrapper.innerHTML += `
      <label class="option-label">
        <input type="radio"
               name="${q.id}"
               value="${opt}">
        ${opt}
      </label>
    `;
  });
}

else if(q.type === 'nan'){

  const options = [
    'Normaal',
    'Afwijkend',
    'Niet uitgevoerd'
  ];

  options.forEach(opt=>{

    wrapper.innerHTML += `
      <label class="option-label">
        <input type="radio"
               name="${q.id}"
               value="${opt}">
        ${opt}
      </label>
    `;
  });
}

  return wrapper;
}

/* =====================================================
   OPEN SECTION
===================================================== */

function openSection(id,btn){

  document.querySelectorAll('.section')
    .forEach(s=>s.classList.remove('active'));

  document.querySelectorAll('.tab-btn')
    .forEach(b=>b.classList.remove('active'));

  document.getElementById(id)
    .classList.add('active');

  btn.classList.add('active');

  window.scrollTo({top:0,behavior:'smooth'});
}

/* =====================================================
   PROGRESS
===================================================== */

function updateProgress(){

  const total = FORM_CONFIG.sections
    .flatMap(s=>s.questions).length;

  let done = 0;

  FORM_CONFIG.sections.forEach(section=>{

    section.questions.forEach(q=>{

      const value = getAnswer(q);

      if(value !== '' && value !== false && value !== null){
        done++;
      }
    });
  });

  const pct = Math.round((done / total) * 100);

  const bar = document.getElementById('progressBar');

  bar.style.width = pct + '%';
  bar.innerText = pct + '%';
}

/* =====================================================
   GET ANSWER
===================================================== */

function getAnswer(q){

  if(q.type === 'text' ||
     q.type === 'number' ||
     q.type === 'date' ||
     q.type === 'textarea' ||
     q.type === 'select'){

    return document.getElementById(q.id).value;
  }

  if(q.type === 'presence'){

    const checked = document.querySelector(`input[name="${q.id}"]:checked`);

    return checked ? checked.value : '';
  }

  if(q.type === 'radio'){

    const checked = document.querySelector(`input[name="${q.id}"]:checked`);

    return checked ? checked.value : '';
  }

  if(q.type === 'checkbox'){

    const checked = document.querySelectorAll(`input[name="${q.id}"]:checked`);

    return Array.from(checked).map(el => el.value);
  }

  return '';
}


/* =====================================================
   EVENTS
===================================================== */

document.addEventListener('change',()=>{
  updateProgress();
  updateCompletedTabs();
});

/* =====================================================
   COMPLETED TABS
===================================================== */

function updateCompletedTabs(){

  FORM_CONFIG.sections.forEach((section,index)=>{

    let completed = true;

    section.questions.forEach(q=>{

      const value = getAnswer(q);

      if(value === '' || value === null){
        completed = false;
      }

      // extra check voor lege checkbox arrays
      if(Array.isArray(value) && value.length === 0){
        completed = false;
      }

    });

    const btn = document.querySelectorAll('.tab-btn')[index];

    if(completed){
      btn.classList.add('completed');
    }
    else{
      btn.classList.remove('completed');
    }

  });
}

const w = window.open('', '_blank', 'width=1000,height=900');

  w.document.write(buildReportHtml(data));

  w.document.close();
}

    sections: []
  };

  FORM_CONFIG.sections.forEach(section=>{

    const sec = {
      title: section.title,
      notes: '',
      questions: []
    };

    section.questions.forEach(q=>{

      sec.questions.push({
        text: q.text,
        answer: getAnswer(q),
        icd11: q.icd11 || ''
      });
    });

    if(section.freeText){
      sec.notes = document.getElementById(`notes_${section.id}`).value;
    }

    output.sections.push(sec);
  });

  return output;
}

/* =====================================================
   HELPERS
===================================================== */

function formatAnswer(answer){

  if(answer == null || answer === ''){
    return 'Niet ingevuld';
  }

  if(Array.isArray(answer)){

    if(answer.length === 0){
      return 'Niet ingevuld';
    }

    return answer
      .map(a => escapeHtml(String(a)))
      .join(', ');
  }

  return escapeHtml(String(answer));
}

function buildPdfTitle(prefix,name,date){
  let code = (name || '')
    .replace(/[^A-Za-z]/g,'')
    .toUpperCase()
    .substring(0,4);
  if(code.length < 4){ code = code.padEnd(4,'X'); }
  return `${prefix} ${code} ${date}`;
}

function getEuropeanDate(){
  const d = new Date();
  const day = String(d.getDate()).padStart(2,'0');
  const month = String(d.getMonth()+1).padStart(2,'0');
  const year = d.getFullYear();
  return `${day}-${month}-${year}`;
}

function escapeHtml(text){
  const div = document.createElement('div');
  div.innerText = text;
  return div.innerHTML;
}

function showInfo(text){
  document.getElementById('infoText').innerHTML = text;
  document.getElementById('infoModal').style.display = 'block';
}

function closeInfo(){
  document.getElementById('infoModal').style.display = 'none';
}

window.addEventListener('load', function(){
  document.getElementById('infoModal')
    .addEventListener('click', function(e){ if(e.target === this)
	{ closeInfo(); }
	  
});

});
