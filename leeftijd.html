
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta property="og:locale" content="nl_BE">
<meta property="og:title" content="Leeftijd berekenen">
<meta property="og:description" content="Experimentele versie – as-is">
<meta property="og:type" content="website">
<meta property="og:url" content="https://medsoftwz.github.io/leeftijd.html">
<meta property="og:image" content="https://medsoftwz.github.io/images/vgltemplate.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:type" content="image/jpg">

<title>Leeftijd Berekenen v2</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f8;padding:30px}
.card{max-width:500px;margin:auto;background:#fff;padding:25px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.field{margin-bottom:20px}

label{display:block;margin-bottom:8px;color:#249bf4}

input{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
.date-row{display:flex;gap:8px}
.readonly{background:#f0f0f0}

.result{color:#109b08; margin-top:20px;padding:15px;background:#eef7ee;border-left:5px solid #2e7d32}

.error{color:#c62828;font-size:14px;margin-top:6px}

h3{ margin:0; text-align:center; color:#109b08; font-size:15px; font-weight: 400;}

button{
  padding:12px 20px;
  border:none;
  border-radius:8px;
  background:#1f4d7a;
  color:white;
  cursor:pointer;
  font-size:15px;
}

button:hover{
  opacity:0.9;
}

</style>
</head>
<body>
<div class="card">
<h3>Leeftijd Berekenen</h3>

<div class="field">
<label>Naam</label>
<input type="text" id="naam">
</div>

<div class="field">
<label>Geboortedatum</label>
<div class="date-row">
<input type="text" id="dag" maxlength="2" inputmode="numeric" placeholder="DD">
<input type="text" id="maand" maxlength="2" inputmode="numeric" placeholder="MM">
<input type="text" id="jaar" maxlength="4" inputmode="numeric" placeholder="JJJJ">
</div>
<div id="datumFout" class="error"></div>
</div>

<div class="field">
<label>Leeftijd</label>
<input type="text" id="leeftijd" class="readonly" readonly>
</div>

<div id="samenvatting" class="result">Nog geen leeftijd berekend.</div>
</div>

<div class="field">
<div style="display: flex; justify-content: center;">
<button type="button" onclick="resetForm()">  Reset </button>
</div>

<hr>

<h3>Leeftijd bij overlijden</h3>

<div class="field">
<label>Geboortejaar</label>
<input type="text" id="geboortejaar" maxlength="4" inputmode="numeric">
</div>

<div class="field">
<label>Overlijdensjaar</label>
<input type="text" id="overlijdensjaar" maxlength="4" inputmode="numeric">
</div>

<div class="field">
<label>Leeftijd bij overlijden</label>
<input type="text" id="leeftijd_overlijden" class="readonly" readonly>
<div id="overlijdenFout" class="error"></div>
</div>

<div class="field">
  <button type="button" onclick="resetForm()">  Reset </button>
</div>

<script>
const dag=document.getElementById('dag');
const maand=document.getElementById('maand');
const jaar=document.getElementById('jaar');
const geboortejaar=document.getElementById('geboortejaar');
const overlijdensjaar=document.getElementById('overlijdensjaar');

dag.addEventListener('input',()=>{
 if(dag.value.length===2) maand.focus();
 calculateAge();
});

maand.addEventListener('input',()=>{
 if(maand.value.length===2) jaar.focus();
 calculateAge();
});

jaar.addEventListener('input',()=>{

  calculateAge();

  if(jaar.value.length===4){

    jaar.blur();

    setTimeout(()=>{
      document.getElementById('samenvatting')
        .scrollIntoView({
          behavior:'smooth',
          block:'center'
        });
    },250);

  }

});

document.getElementById('naam').addEventListener('input',calculateAge);

geboortejaar.addEventListener('input',()=>{
 if(geboortejaar.value.length===4){
   overlijdensjaar.focus();
 }
 calculateDeathAge();
});

overlijdensjaar.addEventListener('input',()=>{
 calculateDeathAge();

 if(overlijdensjaar.value.length===4){
   overlijdensjaar.blur();

   setTimeout(()=>{
      document.getElementById('leeftijd_overlijden')
      .scrollIntoView({behavior:'smooth',block:'center'});
   },250);
 }
});

function calculateAge(){
 const d=parseInt(dag.value);
 const m=parseInt(maand.value);
 const y=parseInt(jaar.value);
 const naam=document.getElementById('naam').value.trim();

 document.getElementById('datumFout').innerText='';

 if(isNaN(d)||isNaN(m)||isNaN(y)) return;

 const geb=new Date(y,m-1,d);

 if(geb.getDate()!=d||geb.getMonth()!=m-1||geb.getFullYear()!=y){
   document.getElementById('datumFout').innerText='Ongeldige datum';
   return;
 }

const vandaag = new Date();

const leeftijd =
  (vandaag - geb) /
  (365.2425 * 24 * 60 * 60 * 1000);

const age =
  leeftijd.toFixed(1).replace('.',',');

 document.getElementById('leeftijd').value=age+' jaar';
 document.getElementById('samenvatting').innerText=naam?naam+' is '+age+' jaar oud.':'Leeftijd: '+age+' jaar.';
}

function calculateDeathAge(){
 const g=parseInt(geboortejaar.value);
 const o=parseInt(overlijdensjaar.value);

 if(isNaN(g)||isNaN(o)) return;

 if(o<g){
   document.getElementById('overlijdenFout').innerText='Overlijdensjaar kleiner dan geboortejaar';
   return;
 }

 document.getElementById('overlijdenFout').innerText='';
 document.getElementById('leeftijd_overlijden').value=(o-g)+' jaar';
}

function resetForm(){

  document.getElementById('naam').value='';

  document.getElementById('dag').value='';
  document.getElementById('maand').value='';
  document.getElementById('jaar').value='';

  document.getElementById('leeftijd').value='';

  document.getElementById('geboortejaar').value='';
  document.getElementById('overlijdensjaar').value='';
  document.getElementById('leeftijd_overlijden').value='';

  document.getElementById('datumFout').innerText='';
  document.getElementById('overlijdenFout').innerText='';

  document.getElementById('samenvatting').innerText =
    'Nog geen leeftijd berekend.';

  document.getElementById('naam').focus();
}

</script>
</body>
</html>
